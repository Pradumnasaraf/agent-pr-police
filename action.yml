name: 'Agent PR Police'
description: 'Detect, label, and summarize pull requests opened by AI coding agents like Copilot, Claude Code, Devin, and Cursor.'
author: 'Pradumna Saraf'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  label:
    description: 'Label applied to detected agent PRs. Also recognized as an agent marker if added manually.'
    required: false
    default: 'pr-by-ai'
  add-label:
    description: 'Apply the label to detected agent PRs.'
    required: false
    default: 'true'
  comment:
    description: 'Post and update a single sticky comment summarizing what the PR changed.'
    required: false
    default: 'true'
  treat-all-prs-as-agent:
    description: 'Skip detection and treat every PR as agent-authored.'
    required: false
    default: 'false'
  extra-agent-identifiers:
    description: 'Newline-separated substrings matched against the PR author login, branch name, and co-author trailers, for agents not in the built-in registry.'
    required: false
    default: ''
  mention:
    description: 'Handles to cc in the comment on agent PRs (space/comma/newline separated, e.g. "@alice @org/team"). The PR author is skipped. Needs comment enabled.'
    required: false
    default: ''
  request-reviewers:
    description: 'Users and teams to request a review from on agent PRs (e.g. "@alice @org/team"). The PR author is skipped. Failures (no access, etc.) are ignored, never fatal.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the PR, add the label, and post the comment.'
    required: false
    default: ${{ github.token }}

outputs:
  is-agent-pr:
    description: 'Whether the PR was detected as authored by an AI coding agent.'
  agent:
    description: 'Name of the detected agent, empty if none was identified.'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/pradumnasaraf/agent-pr-police:v1'
  env:
    INPUT_LABEL: ${{ inputs.label }}
    INPUT_ADD_LABEL: ${{ inputs.add-label }}
    INPUT_COMMENT: ${{ inputs.comment }}
    INPUT_TREAT_ALL_PRS_AS_AGENT: ${{ inputs.treat-all-prs-as-agent }}
    INPUT_EXTRA_AGENT_IDENTIFIERS: ${{ inputs.extra-agent-identifiers }}
    INPUT_MENTION: ${{ inputs.mention }}
    INPUT_REQUEST_REVIEWERS: ${{ inputs.request-reviewers }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
